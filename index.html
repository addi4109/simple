<!doctype html>
<html>
<head>
<title>Page Divide Left Part and Right Part</title>
<style>
*{
margin: 0;
padding: 0;
box-sizing: border-box;
}
.wrapper {
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
}
.container
{
max-width: 1200px;
display: flex;
justify-content: center;
align-items: stretch;
gap: 30px;
padding: 20px;
}
.left-card
{
width: 40%;
border-radius: 10px;
background-color: #DCDCDC;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
text-align: center;
transition: 0.3s;
padding: 25px;
}
.right-card
{
width: 40%;
border-radius: 10px;
background-color: #000080;
display: flex;
justify-content: center;
align-items: center;
transition: 0.3s;
padding: 25px;
}
.left-card p
{
margin: 20px;
}
.left-card:hover
{
transform: scale(1.05);
color: white;
background-color: #800080;
cursor: pointer
}
.right-card:hover
{
transform: scale(1.03);
background-color: #800080;
cursor: pointer
}
.right-card img {
  width: 80%;
  height: auto;
}
@media(max-width: 768px)
{
.container
{
flex-direction: column;
min-height: auto;
gap: 20px;
}
.left-card,.right-card
{
width:100%;
}
.right-card img
{
max-width: 100%;
height: auto;
}
}
</style>
</head>
<body>
<div class="wrapper">
<div class="container">
<div class="left-card">
<h2>About Us</h2>
<p>We are passionate developers focused on building modern, responsive, and user-friendly websites. Our goal is to create clean designs and efficient solutions that deliver a great user experience.</p>
</div>
<div class="right-card"><img src="https://png.pngtree.com/png-vector/20220705/ourmid/pngtree-red-welcome-in-banner-style-png-image_5687333.png"></div>
</div>
</div>
</body>
</html>
